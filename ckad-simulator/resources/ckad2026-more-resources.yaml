apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-liveness
  namespace: dk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-liveness
  template:
    metadata:
      labels:
        app: broken-liveness
    spec:
      containers:
      - name: app
        image: nginx:1.25
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /healthz/return500
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-http
  namespace: dk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-http
  template:
    metadata:
      labels:
        app: probe-http
    spec:
      containers:
      - name: probe-http
        image: registry.k8s.io/e2e-test-images/agnhost:2.40
        args:
        - netexec
        - --http-port=80
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-low
  namespace: cpu-stress
  labels:
    app: cpu-low
spec:
  containers:
  - name: runner
    image: busybox:1.36
    command:
    - sh
    - -c
    - while true; do dd if=/dev/zero of=/dev/null bs=1 count=2000 >/dev/null 2>&1; sleep 1; done
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-medium
  namespace: cpu-stress
  labels:
    app: cpu-medium
spec:
  containers:
  - name: runner
    image: busybox:1.36
    command:
    - sh
    - -c
    - while true; do dd if=/dev/zero of=/dev/null bs=4096 count=100000 >/dev/null 2>&1; done
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-high
  namespace: cpu-stress
  labels:
    app: cpu-high
spec:
  containers:
  - name: runner
    image: busybox:1.36
    command:
    - sh
    - -c
    - while true; do dd if=/dev/zero of=/dev/null bs=1M count=128 >/dev/null 2>&1; done
---
apiVersion: v1
kind: LimitRange
metadata:
  name: haddock-memory-limits
  namespace: haddock
spec:
  limits:
  - type: Container
    max:
      memory: 64Mi
    min:
      memory: 8Mi
    default:
      memory: 32Mi
    defaultRequest:
      memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nosql
  namespace: haddock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nosql
  template:
    metadata:
      labels:
        app: nosql
    spec:
      containers:
      - name: nosql
        image: redis:7.2-alpine
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
