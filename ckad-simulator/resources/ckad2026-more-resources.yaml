apiVersion: apps/v1
kind: Deployment
metadata:
  name: current-chipmunk-deployment
  namespace: goshawk
spec:
  replicas: 5
  selector:
    matchLabels:
      app: chipmunk
      release: stable
  template:
    metadata:
      labels:
        app: chipmunk
        release: stable
    spec:
      containers:
      - name: chipmunk
        image: nginx:1.24
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: chipmunk-service
  namespace: goshawk
spec:
  selector:
    app: chipmunk
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
