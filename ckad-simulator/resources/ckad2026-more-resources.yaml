apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-participant-only-front-db
  namespace: ckad00018
spec:
  podSelector:
    matchLabels:
      role: participant
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: front
    - podSelector:
        matchLabels:
          app: db
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: front
    - podSelector:
        matchLabels:
          app: db
