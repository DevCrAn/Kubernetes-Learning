apiVersion: v1
kind: ServiceAccount
metadata:
  name: honeybee-sa
  namespace: gorilla
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: honeybee-sa-reader
  namespace: gorilla
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: honeybee-sa-reader-binding
  namespace: gorilla
subjects:
- kind: ServiceAccount
  name: honeybee-sa
  namespace: gorilla
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: honeybee-sa-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeybee-deployment
  namespace: gorilla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honeybee
  template:
    metadata:
      labels:
        app: honeybee
    spec:
      serviceAccountName: default
      containers:
      - name: honeybee
        image: bitnami/kubectl:1.31
        command:
        - sh
        - -c
        - while true; do kubectl get serviceaccounts -n gorilla 1>/tmp/out 2>/tmp/err; cat /tmp/out /tmp/err; sleep 5; done
---
